name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Secret Scan
        run: python scripts/secret_scan.py

  backend:
    name: Backend Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest
    env:
      FORCE_CPU: "1"
      ENVIRONMENT: "test"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements/backend.txt
            requirements/ml-cpu.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/backend.txt
          pip install -r requirements/ml-cpu.txt
          pip install ruff==0.9.10 mypy==1.15.0 pytest==8.3.5 pytest-asyncio==0.25.3

      - name: Lint with Ruff
        run: python -m ruff check backend ml scripts tests

      - name: Type check with Mypy
        run: python -m mypy backend --ignore-missing-imports

      - name: Run Unit Tests
        run: python -m pytest tests/unit/ -v

  frontend:
    name: Frontend Lint, Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint Frontend
        run: npm run lint

      - name: Type check Frontend
        run: npx tsc --noEmit

      - name: Build Frontend
        run: npm run build
